<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calorie tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181a" media="(prefers-color-scheme: dark)">
<title>Calorie tracker</title>
<style>
:root {
  --bg: #f6f5f2; --card: #ffffff; --ink: #1d2124; --muted: #6b7378; --line: #e5e3de;
  --eat: #d9661a; --eat-soft: #fbe9db; --burn: #0e8a80; --burn-soft: #d9f0ed;
  --accent: #1d2124; --accent-ink: #ffffff; --danger: #b3261e; --shadow: 0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16181a; --card: #1f2224; --ink: #eceae6; --muted: #98a0a5; --line: #2e3336;
    --eat: #f08a3c; --eat-soft: #3a2a1d; --burn: #3fbdb1; --burn-soft: #17332f;
    --accent: #eceae6; --accent-ink: #16181a; --danger: #f2736b; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #16181a; --card: #1f2224; --ink: #eceae6; --muted: #98a0a5; --line: #2e3336;
  --eat: #f08a3c; --eat-soft: #3a2a1d; --burn: #3fbdb1; --burn-soft: #17332f;
  --accent: #eceae6; --accent-ink: #16181a; --danger: #f2736b; --shadow: none;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
button { font: inherit; color: inherit; cursor: pointer; }
input, select { font: inherit; color: inherit; }
.wrap { max-width: 560px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top)) 16px 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
.stack > * + * { margin-top: 12px; }

/* top bar */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.datenav { display: flex; align-items: center; gap: 4px; }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 20px; line-height: 1; }
.iconbtn:disabled { opacity: .35; cursor: default; }
.datelabel { min-width: 120px; text-align: center; font-weight: 600; }
.pill { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
.pill.bad { color: var(--danger); border-color: var(--danger); }

/* summary */
.sumgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.sumgrid .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.sumgrid .val { font-size: 28px; font-weight: 700; margin-top: 2px; }
.sumgrid .unit { font-size: 12px; color: var(--muted); }
.eat-c { color: var(--eat); } .burn-c { color: var(--burn); }
.bars { margin-top: 14px; display: grid; gap: 6px; }
.bar { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 6px; }
.bar.eat > i { background: var(--eat); } .bar.burn > i { background: var(--burn); }
.netline { margin-top: 12px; text-align: center; font-size: 14px; color: var(--muted); }
.netline b { color: var(--ink); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.stat .lbl { font-size: 12px; color: var(--muted); }
.stat .val { font-size: 20px; font-weight: 650; margin-top: 2px; }
.stat .sub { font-size: 12px; color: var(--muted); }

/* meals */
.mealhead { display: flex; align-items: center; justify-content: space-between; margin: 4px 2px 6px; }
.mealhead h3 { margin: 0; font-size: 15px; }
.addmini { border: 0; background: none; color: var(--eat); font-weight: 600; font-size: 14px; padding: 6px 4px; }
.entry { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;
  text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.entry + .entry { margin-top: 6px; }
.entry .name { overflow: hidden; text-overflow: ellipsis; }
.entry .qty { color: var(--muted); font-size: 13px; margin-left: 6px; }
.empty { color: var(--muted); font-size: 14px; padding: 6px 2px 2px; }

/* fab + nav */
.fab { position: fixed; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 5;
  background: var(--eat); color: #fff; border: 0; border-radius: 999px; padding: 14px 20px; font-weight: 650;
  box-shadow: 0 6px 18px rgba(0,0,0,.25); }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line);
  display: flex; padding-bottom: env(safe-area-inset-bottom); }
.nav button { flex: 1; border: 0; background: none; padding: 12px 0 14px; font-size: 13px; color: var(--muted); }
.nav button.on { color: var(--ink); font-weight: 650; }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; background: var(--bg); border-radius: 20px 20px 0 0;
  padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
.sheet h2 { margin: 0 0 12px; font-size: 18px; }
.row { display: flex; gap: 8px; }
.field { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.field:focus { outline: 2px solid var(--eat); outline-offset: -1px; }
.btn { border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); padding: 12px 18px; font-weight: 650; }
.btn.eat { background: var(--eat); color: #fff; }
.btn.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: none; color: var(--danger); border: 1px solid var(--line); }
.btn:disabled { opacity: .4; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 14px; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.sugg { margin-top: 12px; }
.sugg .hd { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 10px 2px 6px; }
.stepper { display: flex; align-items: center; gap: 14px; }
.stepper button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 22px; }
.lbl2 { font-size: 13px; color: var(--muted); margin: 12px 2px 4px; display: block; }

/* trends */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); }
.seg button { border: 0; background: none; padding: 8px 14px; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--ink); color: var(--bg); font-weight: 650; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
svg text { fill: var(--muted); font-size: 10px; font-family: inherit; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 15px; }
.kv .k { color: var(--muted); }

/* settings */
.set h3 { margin: 0 0 8px; font-size: 15px; }
.set p { margin: 6px 0; font-size: 14px; }
.errbox { background: var(--eat-soft); border-radius: 10px; padding: 10px 12px; font-size: 13px; word-break: break-word; margin-top: 8px; }
pre.raw { white-space: pre-wrap; word-break: break-all; font-size: 11px; max-height: 240px; overflow: auto; background: var(--bg); padding: 8px; border-radius: 8px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(140px + env(safe-area-inset-bottom)); z-index: 30;
  background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 14px; display: flex; gap: 14px; align-items: center; font-size: 14px; }
.toast button { background: none; border: 0; color: var(--eat); font-weight: 700; padding: 0; }

[hidden] { display: none !important; }
.entry .nm { display: flex; flex-direction: column; min-width: 0; }
.entry .sub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.macros { margin-top: 12px; text-align: center; font-size: 14px; color: var(--muted); }
.macros b { color: var(--ink); }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.grid4 .field, .grid3 .field { padding: 10px 8px; }
.mealact { display: flex; gap: 4px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="nav" id="nav"></nav>
<div id="overlay"></div>
<div id="toast"></div>

<script>
'use strict';
const BUILD = '2026-10-31.5';
const STORE_KEY = 'intake.v1';
const MEALS = ['Breakfast', 'Lunch', 'Dinner', 'Snacks'];
const KCAL_PER_KG = 7700;

/* ---------- built-in staples: [name, kcal, protein, carbs, fat per 100 g, serving g, serving label] ----------
   Typical generic values; products from a pack should be scanned instead. */
const STAPLE_ROWS = [
  ['Egg', 143, 12.6, 0.7, 9.5, 50, '1 egg'], ['Banana', 89, 1.1, 22.8, 0.3, 118, '1 medium'],
  ['Apple', 52, 0.3, 13.8, 0.2, 182, '1 medium'], ['Orange', 47, 0.9, 11.8, 0.1, 131, '1 medium'],
  ['Bread, white', 265, 9, 49, 3.2, 30, '1 slice'], ['Bread, wholemeal', 247, 13, 41, 3.4, 32, '1 slice'],
  ['Rice, cooked', 130, 2.7, 28, 0.3, 150, '1 cup'], ['Pasta, cooked', 158, 5.8, 31, 0.9, 140, '1 portion'],
  ['Oats, dry', 389, 16.9, 66, 6.9, 40, '40 g'], ['Potato, boiled', 87, 1.9, 20, 0.1, 150, '1 medium'],
  ['Sweet potato', 86, 1.6, 20, 0.1, 130, '1 medium'], ['Chicken breast, cooked', 165, 31, 0, 3.6, 120, '1 breast'],
  ['Salmon, cooked', 206, 22, 0, 12, 120, '1 fillet'], ['Beef mince, cooked', 250, 26, 0, 15, 100, '100 g'],
  ['Tuna, canned', 116, 25.5, 0, 0.8, 100, '1 can'], ['Tofu', 76, 8, 1.9, 4.8, 100, '100 g'],
  ['Cheddar cheese', 403, 25, 1.3, 33, 30, '30 g'], ['Milk, whole', 61, 3.2, 4.8, 3.3, 240, '1 glass'],
  ['Milk, skimmed', 34, 3.4, 5, 0.1, 240, '1 glass'], ['Greek yogurt', 97, 9, 3.9, 5, 150, '1 pot'],
  ['Butter', 717, 0.9, 0.1, 81, 10, '1 tsp'], ['Olive oil', 884, 0, 0, 100, 14, '1 tbsp'],
  ['Avocado', 160, 2, 8.5, 14.7, 100, 'half'], ['Broccoli', 34, 2.8, 6.6, 0.4, 90, '1 cup'],
  ['Carrot', 41, 0.9, 9.6, 0.2, 60, '1 medium'], ['Tomato', 18, 0.9, 3.9, 0.2, 120, '1 medium'],
  ['Cucumber', 15, 0.7, 3.6, 0.1, 100, '100 g'], ['Spinach', 23, 2.9, 3.6, 0.4, 30, '1 handful'],
  ['Onion', 40, 1.1, 9.3, 0.1, 110, '1 medium'], ['Lentils, cooked', 116, 9, 20, 0.4, 150, '1 cup'],
  ['Chickpeas, cooked', 164, 8.9, 27.4, 2.6, 120, '1/2 cup'], ['Almonds', 579, 21.2, 21.6, 49.9, 28, '1 handful'],
  ['Peanut butter', 588, 25, 20, 50, 32, '2 tbsp'], ['Dark chocolate', 546, 4.9, 61, 31, 20, '2 squares'],
  ['Sugar', 387, 0, 100, 0, 4, '1 tsp'], ['Coffee, black', 1, 0.1, 0, 0, 240, '1 cup'],
  ['Beer', 43, 0.5, 3.6, 0, 330, '1 bottle'], ['Wine', 83, 0.1, 2.6, 0, 150, '1 glass'],
  ['Pizza', 266, 11, 33, 10, 107, '1 slice'], ['Hummus', 166, 7.9, 14, 9.6, 30, '2 tbsp'],
];
const STAPLES = STAPLE_ROWS.map(([name, kcal, p, c, f, g, label]) => ({
  key: 'staple:' + name.toLowerCase(), name, brand: '', per100: { kcal, p, c, f }, servingG: g, servingLabel: label, source: 'staple',
}));

/* ---------- state ---------- */
let S = load();
let view = 'today';
let viewDate = ymd(new Date());
let trendDays = 14;

function blank() { return { entries: {}, foods: {}, fit: {}, settings: { baseUrl: '', appKey: '' }, sync: null }; }
function load() {
  try { return Object.assign(blank(), JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); }
  catch { return blank(); }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
  catch (e) { toast('Could not save: browser storage is full or blocked.'); }
}

/* ---------- helpers ---------- */
function ymd(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function parseYmd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function uid() { return (crypto.randomUUID && crypto.randomUUID()) || String(Date.now()) + Math.random().toString(16).slice(2); }
function fmt(n) { return Math.round(n).toLocaleString(); }
function signed(n) { return (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n)); }
function dur(min) { return `${Math.floor(min / 60)}h ${String(Math.round(min % 60)).padStart(2, '0')}m`; }
function defaultMeal() { const h = new Date().getHours(); return h < 11 ? 'Breakfast' : h < 15 ? 'Lunch' : h < 21 ? 'Dinner' : 'Snacks'; }
function dayLabel(s) {
  const t = ymd(new Date());
  if (s === t) return 'Today';
  if (s === addDays(t, -1)) return 'Yesterday';
  return parseYmd(s).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
}

/* ---------- food log model ----------
   Entries hold per-item values plus a quantity. Deletes are tombstones so nothing
   (import, demo removal) can resurrect a deleted item. Re-logging the same food in
   the same meal and day bumps the quantity instead of adding a duplicate row.
   Foods logged by weight also keep their per-100 g base, so a wrong number can be fixed at the source. */
function liveEntries(date) { return Object.values(S.entries).filter(e => !e.deleted && e.date === date); }
function eaten(date) { return liveEntries(date).reduce((a, e) => a + e.unitKcal * e.qty, 0); }
const hasMacros = e => typeof e.unitP === 'number' && typeof e.unitC === 'number' && typeof e.unitF === 'number';
function macroTotals(date) {
  const es = liveEntries(date), t = { p: 0, c: 0, f: 0, n: 0, total: es.length };
  es.forEach(e => { if (hasMacros(e)) { t.p += e.unitP * e.qty; t.c += e.unitC * e.qty; t.f += e.unitF * e.qty; t.n++; } });
  return t;
}
const r1 = v => Math.round(v * 10) / 10;
const numOrNull = v => (v === '' || v == null || isNaN(+v)) ? null : +v;
function portion(per100, grams) {
  const m = v => (typeof v === 'number' ? r1(v * grams / 100) : null);
  return { kcal: Math.round(per100.kcal * grams / 100), p: m(per100.p), c: m(per100.c), f: m(per100.f) };
}
function identity(e) { return `${e.date}|${e.meal}|${e.name.trim().toLowerCase()}|${e.unitKcal}|${e.grams || ''}`; }
function logEntry(spec) {
  const hit = Object.values(S.entries).find(e => !e.deleted && identity(e) === identity(spec));
  let id;
  if (hit) { hit.qty += 1; hit.updatedAt = Date.now(); id = hit.id; }
  else {
    id = uid();
    S.entries[id] = Object.assign({ id, qty: 1, createdAt: Date.now(), updatedAt: Date.now() }, spec, { name: spec.name.trim() });
  }
  save();
  return { id, merged: !!hit };
}

/* Saved foods: everything logged by weight (scanned, searched, or common) is remembered with its per-100 g numbers. */
function foodKeyOf(f) { return f.key || (f.code ? 'code:' + f.code : 'name:' + f.name.trim().toLowerCase() + '|' + f.per100.kcal); }
function saveFood(f) {
  const key = foodKeyOf(f);
  S.foods[key] = Object.assign({}, S.foods[key], f, { key, updatedAt: Date.now() });
  delete S.foods[key].deleted; delete S.foods[key].deletedAt;
  return key;
}
function liveFoods() { return Object.values(S.foods).filter(f => !f.deleted).sort((a, b) => b.updatedAt - a.updatedAt); }
function defaultGrams(f) { return f.lastGrams || f.servingG || 100; }
function logPortion(food, grams, meal, date) {
  const pt = portion(food.per100, grams);
  const key = saveFood(Object.assign({}, food, { lastGrams: grams }));
  return logEntry({ date, meal, name: food.name, unitKcal: pt.kcal, unitP: pt.p, unitC: pt.c, unitF: pt.f, grams, per100: food.per100, code: food.code || undefined, foodKey: key });
}
function manualRecents() {
  const seen = new Map();
  Object.values(S.entries).filter(e => !e.deleted && !e.per100 && !String(e.id).startsWith('demo-'))
    .sort((a, b) => b.updatedAt - a.updatedAt)
    .forEach(e => {
      const k = `${e.name.toLowerCase()}|${e.unitKcal}`;
      if (!seen.has(k)) seen.set(k, { name: e.name, unitKcal: e.unitKcal, unitP: e.unitP, unitC: e.unitC, unitF: e.unitF });
    });
  return [...seen.values()].slice(0, 30);
}
function macroText(e, times) {
  const q = times ? e.qty : 1;
  return hasMacros(e) ? `${times && e.qty > 1 ? 'total ' : ''}P ${Math.round(e.unitP * q)} · C ${Math.round(e.unitC * q)} · F ${Math.round(e.unitF * q)}` : '';
}

/* ---------- Fitbit data (cached per day, written by sync) ---------- */
function fitDay(date) { return S.fit[date] || {}; }
function burned(date) { const v = fitDay(date).caloriesOut; return typeof v === 'number' ? v : null; }

// Body and recovery numbers from Google Health. Not every device records all of them: a tile only shows when there is data.
const BODY = [
  { k: 'weightKg', label: 'Weight', unit: 'kg', dp: 1, latest: true },
  { k: 'bodyFatPct', label: 'Body fat', unit: '%', dp: 1, latest: true },
  { k: 'hrv', label: 'HRV', unit: 'ms', dp: 0 },
  { k: 'spo2', label: 'Blood oxygen', unit: '%', dp: 1 },
  { k: 'breathingRate', label: 'Breathing', unit: 'per min', dp: 1 },
  { k: 'skinTempDelta', label: 'Skin temp', unit: '°C vs normal', dp: 1, sign: true },
];
const numStr = (m, v) => { const t = Math.abs(v).toFixed(m.dp); return (m.sign && +t > 0 ? (v > 0 ? '+' : '−') : '') + t; };
// Weight and body fat are not measured every day, so show the latest reading up to 30 days back, labelled with its date.
function bodyValue(m, date) {
  const own = fitDay(date)[m.k];
  if (typeof own === 'number') return { v: own, date };
  if (!m.latest) return null;
  for (let i = 1; i <= 30; i++) { const d = addDays(date, -i), v = fitDay(d)[m.k]; if (typeof v === 'number') return { v, date: d }; }
  return null;
}

function baseUrl() {
  const b = (S.settings.baseUrl || '').trim().replace(/\/$/, '');
  return /^https?:\/\//.test(b) ? b : null;
}
async function api(path, opts = {}) {
  const base = baseUrl();
  if (base === null) throw new Error('Enter your Worker address in Settings first (it starts with https://).');
  const res = await fetch(base + path, { ...opts, headers: { ...(opts.headers || {}), 'X-App-Key': S.settings.appKey } });
  let body = null;
  try { body = await res.json(); } catch { /* non-JSON */ }
  if (!res.ok) throw new Error((body && body.error) || `Server returned ${res.status}`);
  return body;
}

let syncing = false;
async function sync(days = 14) {
  if (syncing) return;
  if (!S.settings.appKey) { S.sync = { at: Date.now(), ok: false, message: 'Not set up yet. Open Settings to connect.' }; save(); render(); return; }
  syncing = true; render();
  try {
    const to = ymd(new Date());
    const out = await api(`/api/days?from=${addDays(to, -(days - 1))}&to=${to}`);
    for (const [date, vals] of Object.entries(out.days || {})) S.fit[date] = Object.assign(S.fit[date] || {}, vals);
    const errs = out.errors || [];
    S.sync = {
      at: Date.now(),
      ok: errs.length === 0,
      partial: errs.length > 0 && Object.keys(out.days || {}).length > 0,
      needsReconnect: !!out.needsReconnect,
      message: errs.length ? errs.map(e => `${e.type}: ${e.message}`).join('\n') : 'Everything updated.',
    };
  } catch (e) {
    S.sync = { at: Date.now(), ok: false, message: e.message || String(e), needsReconnect: /reconnect/i.test(e.message || '') };
  }
  syncing = false; save(); render();
}

/* ---------- rendering ---------- */
const $ = id => document.getElementById(id);

function render() {
  $('nav').innerHTML = [['today', 'Today'], ['trends', 'Trends'], ['settings', 'Settings']]
    .map(([k, l]) => `<button data-v="${k}" class="${view === k ? 'on' : ''}">${l}</button>`).join('');
  $('nav').querySelectorAll('button').forEach(b => b.onclick = () => { view = b.dataset.v; render(); window.scrollTo(0, 0); });
  const app = $('app');
  if (view === 'today') app.innerHTML = todayHtml();
  else if (view === 'trends') app.innerHTML = trendsHtml();
  else app.innerHTML = settingsHtml();
  bind(app);
}

function syncPill() {
  if (syncing) return `<button class="pill" data-act="sync">Syncing…</button>`;
  const s = S.sync;
  if (!s) return `<button class="pill" data-act="sync">Not synced</button>`;
  const t = new Date(s.at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (s.ok) return `<button class="pill" data-act="sync">Synced ${t}</button>`;
  return `<button class="pill bad" data-act="goto-settings">${s.partial ? 'Partial sync' : 'Sync failed'} · details</button>`;
}

function todayHtml() {
  const isToday = viewDate === ymd(new Date());
  const inK = eaten(viewDate), outK = burned(viewDate), f = fitDay(viewDate);
  const max = Math.max(inK, outK || 0, 1);
  const net = outK === null ? null : inK - outK;
  const mt = macroTotals(viewDate), yest = addDays(viewDate, -1);
  const meals = MEALS.map(m => {
    const es = liveEntries(viewDate).filter(e => e.meal === m).sort((a, b) => a.createdAt - b.createdAt);
    const sub = es.reduce((a, e) => a + e.unitKcal * e.qty, 0);
    const canCopy = !es.length && liveEntries(yest).some(e => e.meal === m);
    return `<section>
      <div class="mealhead"><h3>${m} <span class="muted num" style="font-weight:400">${es.length ? fmt(sub) + ' kcal' : ''}</span></h3>
        <span class="mealact">${canCopy ? `<button class="addmini" data-copy="${m}">Copy yesterday</button>` : ''}<button class="addmini" data-add="${m}">+ Add</button></span></div>
      ${es.map(e => {
        const detail = [e.grams ? `${e.grams} g${e.qty > 1 ? ' each' : ''}` : '', macroText(e, true)].filter(Boolean).join(' · ');
        return `<button class="entry" data-edit="${e.id}"><span class="nm"><span class="name">${esc(e.name)}${e.qty > 1 ? `<span class="qty">× ${e.qty}</span>` : ''}</span>${detail ? `<span class="sub">${esc(detail)}</span>` : ''}</span>
          <span class="num">${fmt(e.unitKcal * e.qty)}</span></button>`;
      }).join('')}

  return `
  <div class="topbar">
    <div class="datenav">
      <button class="iconbtn" data-act="prev" aria-label="Previous day">‹</button>
      <div class="datelabel">${dayLabel(viewDate)}</div>
      <button class="iconbtn" data-act="next" aria-label="Next day" ${isToday ? 'disabled' : ''}>›</button>
    </div>${syncPill()}
  </div>
  <div class="stack">
    <div class="card">
      <div class="sumgrid">
        <div><div class="lbl">Eaten</div><div class="val num eat-c">${fmt(inK)}</div><div class="unit">kcal</div></div>
        <div><div class="lbl">Burned</div><div class="val num burn-c">${outK === null ? '—' : fmt(outK)}</div><div class="unit">kcal${isToday && outK !== null ? ' so far' : ''}</div></div>
        <div><div class="lbl">Net</div><div class="val num">${net === null ? '—' : signed(net)}</div><div class="unit">${net === null ? 'no burn data' : net <= 0 ? 'deficit' : 'surplus'}</div></div>
      </div>
      <div class="bars">
        <div class="bar eat"><i style="width:${(inK / max) * 100}%"></i></div>

      </div>

      ${outK !== null && f.activeKcal != null ? `<div class="macros num">Active <b>${fmt(f.activeKcal)} kcal</b> · resting and other <b>${fmt(Math.max(0, outK - f.activeKcal))} kcal</b></div>` : ''}
      ${outK === null ? `<div class="netline">Burned calories appear once your Fitbit is connected in Settings.</div>` : ''}
    </div>

      <div class="stat"><div class="lbl">Steps</div><div class="val num">${f.steps != null ? fmt(f.steps) : '—'}</div></div>

function bodyTiles(date) {
  const tiles = BODY.map(m => {
    const b = bodyValue(m, date); if (!b) return '';
    const note = b.date === date ? m.unit : `${m.unit} · ${dayLabel(b.date)}`;
    return `<div class="stat"><div class="lbl">${m.label}</div><div class="val num">${numStr(m, b.v)}</div><div class="sub">${esc(note)}</div></div>`;
  }).join('');
  return tiles ? `<div class="stats">${tiles}</div>` : '';
}

// Averages over the same completed days as the chart, plus the weight line when there are readings.
function bodyTrendHtml(days) {
  const avg = a => a.reduce((x, y) => x + y, 0) / a.length;
  const rows = [];
  const act = days.map(d => fitDay(d).activeKcal).filter(v => typeof v === 'number');
  if (act.length) rows.push(`<span class="k">Avg active burn (${act.length} days)</span><b>${fmt(avg(act))} kcal</b>`);
  for (const m of BODY) {
    const vals = days.map(d => fitDay(d)[m.k]).filter(v => typeof v === 'number');
    if (!vals.length) continue;
    rows.push(`<span class="k">${m.label}${m.latest ? ' latest' : ' avg'} (${vals.length} ${m.latest ? 'readings' : 'days'})</span><b>${numStr(m, m.latest ? vals[vals.length - 1] : avg(vals))} ${esc(m.unit)}</b>`);
  }
  const w = days.map(d => ({ d, v: fitDay(d).weightKg })).filter(p => typeof p.v === 'number');
  let spark = '';
  if (w.length >= 2) {
    const lo = Math.min(...w.map(p => p.v)), hi = Math.max(...w.map(p => p.v)), span = Math.max(hi - lo, 0.4);
    const pts = w.map((p, i) => `${(6 + (i / (w.length - 1)) * 328).toFixed(1)},${(44 - ((p.v - lo) / span) * 36).toFixed(1)}`).join(' ');
    const change = w[w.length - 1].v - w[0].v;
    rows.push(`<span class="k">Weight change (${w.length} readings)</span><b>${change > 0 ? '+' : change < 0 ? '−' : ''}${Math.abs(change).toFixed(1)} kg</b>`);
    spark = `<svg viewBox="0 0 340 52" width="100%" role="img" aria-label="Weight over the period" style="margin-top:10px"><polyline points="${pts}" fill="none" stroke="var(--eat)" stroke-width="2" stroke-linejoin="round"/>${w.map((p, i) => `<circle cx="${(6 + (i / (w.length - 1)) * 328).toFixed(1)}" cy="${(44 - ((p.v - lo) / span) * 36).toFixed(1)}" r="2.5" fill="var(--eat)"/>`).join('')}</svg>`;
  }
  if (!rows.length) return '';
  return `<div class="card"><h3>Body and recovery</h3><div class="kv num">${rows.join('')}</div>${spark}
      <p class="muted" style="font-size:12px;margin:10px 0 0">Shows only what your Fitbit has sent. Compare the weight change with the “rough weight effect” above: if they keep disagreeing, your logged food or the burn estimate is off.</p></div>`;
}

// Which Google Health numbers have actually arrived, so you can see what your device records.
function coverageHtml() {
  const today = ymd(new Date()), days = [];
  for (let i = 0; i < 30; i++) days.push(addDays(today, -i));
  const all = [['steps', 'Steps'], ['caloriesOut', 'Calories burned'], ['activeKcal', 'Active calories'], ['sleepMinutes', 'Sleep'], ['restingHr', 'Resting heart rate'], ...BODY.map(m => [m.k, m.label])];
  if (!days.some(d => Object.keys(fitDay(d)).length)) return '';
  return `<div class="card"><h3>What your Fitbit has sent</h3>
    <p class="muted">Days with data in the last 30. “Nothing yet” means Google has none for you, usually because the device doesn't record it or it was never synced.</p>
    <div class="kv num">${all.map(([k, l]) => { const n = days.filter(d => typeof fitDay(d)[k] === 'number').length; return `<span class="k">${l}</span><b>${n ? n + ' days' : 'Nothing yet'}</b>`; }).join('')}</div></div>`;
}

function trendsHtml() {
  const today = ymd(new Date());
  const days = [];
  for (let i = trendDays; i >= 1; i--) days.push(addDays(today, -i)); // completed days only
  const pts = days.map(d => ({ d, i: liveEntries(d).length ? eaten(d) : null, o: burned(d) }));
  const both = pts.filter(p => p.i !== null && p.o !== null);
  const eatenDays = pts.filter(p => p.i !== null), burnDays = pts.filter(p => p.o !== null);
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const aIn = avg(eatenDays.map(p => p.i)), aOut = avg(burnDays.map(p => p.o));
  const netTotal = both.reduce((a, p) => a + (p.i - p.o), 0);
  const aNet = both.length ? netTotal / both.length : null;

  const W = 340, H = 170, padL = 30, padB = 20, padT = 8, plotH = H - padB - padT, plotW = W - padL - 4;
  const top = Math.max(500, ...pts.map(p => Math.max(p.i || 0, p.o || 0)));
  const step = top <= 2000 ? 500 : 1000;
  const niceTop = Math.ceil(top / step) * step;
  const slot = plotW / pts.length, bw = Math.max(2, Math.min(10, slot * 0.38));
  const y = v => padT + plotH - (v / niceTop) * plotH;
  let svg = '';
  for (let g = 0; g <= niceTop; g += step) {
    svg += `<line x1="${padL}" x2="${W - 4}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)" stroke-width="1"/><text x="${padL - 4}" y="${y(g) + 3}" text-anchor="end">${fmt(g)}</text>`;
  }
  pts.forEach((p, k) => {
    const cx = padL + slot * k + slot / 2;
    if (p.i !== null) svg += `<rect x="${cx - bw - 0.5}" y="${y(p.i)}" width="${bw}" height="${plotH + padT - y(p.i)}" rx="2" fill="var(--eat)"/>`;
    if (p.o !== null) svg += `<rect x="${cx + 0.5}" y="${y(p.o)}" width="${bw}" height="${plotH + padT - y(p.o)}" rx="2" fill="var(--burn)"/>`;
    const label = trendDays <= 14 || k % 5 === 0 ? parseYmd(p.d).getDate() : '';
    if (label !== '') svg += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${label}</text>`;
  });

  return `
  <div class="topbar"><h2 style="margin:0;font-size:20px">Trends</h2>${syncPill()}</div>
  <div class="stack">
    <div class="seg">${[7, 14, 30].map(n => `<button data-trend="${n}" class="${trendDays === n ? 'on' : ''}">${n} days</button>`).join('')}</div>
    <div class="card">
      <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Calories eaten and burned per day">${svg}</svg>
      <div class="legend"><span><i style="background:var(--eat)"></i>Eaten</span><span><i style="background:var(--burn)"></i>Burned</span></div>
    </div>
    <div class="card">
      <div class="kv num">
        <span class="k">Avg eaten (${eatenDays.length} logged days)</span><span class="eat-c"><b>${aIn === null ? '—' : fmt(aIn) + ' kcal'}</b></span>
        <span class="k">Avg burned (${burnDays.length} days)</span><span class="burn-c"><b>${aOut === null ? '—' : fmt(aOut) + ' kcal'}</b></span>
        <span class="k">Avg net per day</span><b>${aNet === null ? '—' : signed(aNet) + ' kcal'}</b>
        <span class="k">Total net (${both.length} days)</span><b>${both.length ? signed(netTotal) + ' kcal' : '—'}</b>
        <span class="k">Rough weight effect</span><b>${both.length ? (netTotal / KCAL_PER_KG >= 0 ? '+' : '−') + Math.abs(netTotal / KCAL_PER_KG).toFixed(2) + ' kg' : '—'}</b>
      </div>
      <p class="muted" style="font-size:12px;margin:10px 0 0">Today is left out because it isn't finished. Days where you logged no food are skipped rather than counted as zero. The weight effect is an estimate at 7,700 kcal per kg, not a measurement.</p>
    </div>
    ${bodyTrendHtml(days)}
  </div>`;
}

function bind(root) {
  root.querySelectorAll('[data-add]').forEach(b => b.onclick = () => openAdd(b.dataset.add));
  root.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copyMeal(b.dataset.copy));
  root.querySelectorAll('[data-fooddel]').forEach(b => b.onclick = () => {
    const f = S.foods[b.dataset.fooddel]; if (!f) return;
    f.deleted = 1; f.deletedAt = Date.now(); save(); render();
  });
  root.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openEdit(b.dataset.edit));
  root.querySelectorAll('[data-trend]').forEach(b => b.onclick = () => { trendDays = +b.dataset.trend; render(); });
  root.querySelectorAll('[data-act]').forEach(b => b.onclick = () => act(b.dataset.act));
}

async function act(a) {
  if (a === 'prev') { viewDate = addDays(viewDate, -1); render(); }
  else if (a === 'next') { viewDate = addDays(viewDate, 1); render(); }
  else if (a === 'sync') sync();
  else if (a === 'sync-30') { saveConn(); sync(30); }
  else if (a === 'goto-settings') { view = 'settings'; render(); }
  else if (a === 'save-conn') { saveConn(); toast('Saved'); }
  else if (a === 'connect') {
    saveConn();
    const base = baseUrl();
    if (base === null) return toast('Enter the Worker address first.');
    window.open(base + '/auth/start', '_blank');
  }
  else if (a === 'check') {
    saveConn();
    const out = $('checkOut'); out.innerHTML = '<p class="muted">Checking…</p>';
    try {
      const r = await api('/api/status');
      out.innerHTML = `<div class="errbox" style="background:var(--burn-soft)">${r.connected ? 'Server reachable and Google Health is connected.' : 'Server reachable, but Google Health is not connected yet. Tap “Connect Google Health”.'}${r.lastError ? `<br>Last server error: ${esc(r.lastError)}` : ''}</div>`;
    } catch (e) { out.innerHTML = `<div class="errbox">${esc(e.message)}</div>`; }
  }
  else if (a === 'export') exportData();
  else if (a === 'import') $('importFile').click();
  else if (a === 'demo-on') { loadDemo(); render(); toast('Demo data loaded'); }
  else if (a === 'demo-off') { removeDemo(); render(); toast('Demo data removed'); }
  else if (a === 'force') forceRefresh();
  if (a === 'import') $('importFile').onchange = importData;
}
function saveConn() {
  S.settings.appKey = ($('appKey') ? $('appKey').value : S.settings.appKey).trim();
  S.settings.baseUrl = ($('baseUrl') ? $('baseUrl').value : S.settings.baseUrl).trim();
  save();
}

/* Open Food Facts product -> our food shape. Missing numbers stay null so the app never invents them. */
function offToFood(p, code) {
  const n = p.nutriments || {};
  let kcal = numOrNull(n['energy-kcal_100g']);
  if (kcal === null) { const kj = numOrNull(n['energy_100g']); if (kj !== null) kcal = kj / 4.184; }
  const rn = v => (v === null ? null : r1(v));
  const brand = Array.isArray(p.brands) ? p.brands[0] : String(p.brands || '').split(',')[0].trim();
  return {
    code: String(code || p.code || ''), name: (p.product_name || '').trim() || 'Unnamed product', brand: brand || '',
    per100: { kcal: kcal === null ? null : Math.round(kcal), p: rn(numOrNull(n.proteins_100g)), c: rn(numOrNull(n.carbohydrates_100g)), f: rn(numOrNull(n.fat_100g)) },
    servingG: numOrNull(p.serving_quantity), source: 'off',
  };
}
async function lookupBarcode(code) {
  let res;
  try { res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}?fields=code,product_name,brands,serving_quantity,nutriments`); }
  catch { throw new Error('No connection to Open Food Facts. Check your internet and try again.'); }
  if (!res.ok && res.status !== 404) throw new Error('Open Food Facts is not answering right now. Try again, or type the food in by hand.');
  const d = await res.json().catch(() => null);
  if (!d || d.status !== 1 || !d.product) return null;
  return offToFood(d.product, code);
}

  const q = () => name.value.trim().toLowerCase();
  const matches = (list, text) => { const t = q().split(/\s+/).filter(Boolean); return t.length ? list.filter(x => t.every(w => text(x).toLowerCase().includes(w))) : list; };
  const foodSub = f => [f.brand, f.lastGrams ? `${f.lastGrams} g last time` : f.servingLabel ? `${f.servingLabel} · ${f.servingG} g` : f.servingG ? `${f.servingG} g serving` : ''].filter(Boolean).join(' · ');
  const foodKcal = f => (typeof f.per100.kcal === 'number' ? `${portion(f.per100, defaultGrams(f)).kcal} kcal` : '');
  const row = (attrs, nm, sub, right) => `<button class="entry" ${attrs}><span class="nm"><span class="name">${esc(nm)}</span>${sub ? `<span class="sub">${esc(sub)}</span>` : ''}</span><span class="num muted">${esc(right)}</span></button>`;

  const suggest = () => {
    const all = liveFoods(), libKeys = new Set(all.map(f => f.key));
    const lib = matches(all, f => `${f.name} ${f.brand || ''}`).slice(0, 8);
    manRows = matches(manualRecents(), x => x.name).slice(0, 6);
    const st = matches(STAPLES.filter(s => !libKeys.has(s.key)), f => f.name).slice(0, q() ? 8 : 6);
    let h = '';
    if (lib.length) h += `<div class="hd">My foods</div>` + lib.map(f => row(`data-src="lib" data-key="${esc(f.key)}"`, f.name, foodSub(f), foodKcal(f))).join('');
    if (manRows.length) h += `<div class="hd">Recent, added by hand</div>` + manRows.map((x, i) => row(`data-src="man" data-i="${i}"`, x.name, '', `${x.unitKcal} kcal`)).join('');
    if (st.length) h += `<div class="hd">Common foods (typical values)</div>` + st.map(f => row(`data-src="st" data-key="${esc(f.key)}"`, f.name, foodSub(f), foodKcal(f))).join('');
    if (q().length >= 3) h += `<div class="hd">Packaged foods</div>` + row('id="fOnline"', `Search online for “${name.value.trim()}”`, 'Open Food Facts', '›');
    if (online.length) h += online.map((f, i) => row(`data-src="on" data-i="${i}"`, f.name, f.brand, `${f.per100.kcal} kcal/100 g`)).join('');
    if (onlineMsg) h += `<p class="muted" style="font-size:14px">${esc(onlineMsg)}</p>`;
    if (!h) h = `<p class="muted">No match. Type the calories and tap Add, or scan the barcode.</p>`;
    $('sugg').innerHTML = h;
  };
  const finish = (r, nm) => { closeSheet(); render(); loggedToast(r, nm); };
  const quick = food => finish(logPortion(food, defaultGrams(food), chosen, viewDate), food.name);
  const runOnline = async () => {
    onlineMsg = 'Searching…'; online = []; suggest();
    try {
      const r = await api(`/api/foods?q=${encodeURIComponent(name.value.trim())}`);
      online = (r.foods || []).map(f => Object.assign({}, f, { source: 'off' }));
      onlineMsg = online.length ? '' : 'Nothing found online. Try fewer words, or scan the barcode.';
    } catch (e) { onlineMsg = e.message; }
    if ($('sugg')) suggest();
  };
  $('sugg').onclick = ev => {
    const b = ev.target.closest('.entry'); if (!b) return;
    if (b.id === 'fOnline') return runOnline();
    const src = b.dataset.src;
    if (src === 'lib') quick(S.foods[b.dataset.key]);
    else if (src === 'st') quick(STAPLES.find(s => s.key === b.dataset.key));
    else if (src === 'man') {
      const x = manRows[+b.dataset.i];
      finish(logEntry({ date: viewDate, meal: chosen, name: x.name, unitKcal: x.unitKcal, unitP: x.unitP, unitC: x.unitC, unitF: x.unitF }), x.name);
    } else if (src === 'on') { const f = online[+b.dataset.i]; closeSheet(); openPortion(f, chosen); }
  };
  const ready = () => { const k = numOrNull(kcal.value); addBtn.disabled = !(name.value.trim() && k !== null && k > 0); };
  name.oninput = () => { online = []; onlineMsg = ''; suggest(); ready(); };
  kcal.oninput = ready;
  addBtn.onclick = () => {
    const m = [$('fP').value, $('fC').value, $('fF').value].map(numOrNull), any = m.some(v => v !== null);
    const r = logEntry(Object.assign({ date: viewDate, meal: chosen, name: name.value, unitKcal: Math.round(+kcal.value) },
      any ? { unitP: m[0] || 0, unitC: m[1] || 0, unitF: m[2] || 0 } : {}));
    finish(r, name.value.trim());
  };
  $('fMore').onclick = () => { $('fMacros').hidden = !$('fMacros').hidden; };
  $('fScan').onclick = () => { closeSheet(); openScan(chosen); };
  $('fClose').onclick = closeSheet;
  bindChips('mealChips', m => { chosen = m; });
  [name, kcal].forEach(el => el.onkeydown = e => { if (e.key === 'Enter' && !addBtn.disabled) addBtn.click(); });
  suggest();
  setTimeout(() => name.focus(), 50);
}

function openScan(meal) {
  let stream = null, timer = null, busy = false;
  openSheet(`
    <h2>Scan barcode</h2>
    <video id="scanVideo" playsinline muted style="width:100%;border-radius:14px;background:#000;aspect-ratio:4/3;object-fit:cover"></video>
    <p class="muted" id="scanMsg" style="font-size:14px">Starting camera…</p>
    <div class="row"><input class="field num" id="codeIn" inputmode="numeric" placeholder="Or type the digits under the barcode" style="flex:1 1 auto"><button class="btn" id="codeGo">Look up</button></div>
    <div class="row" style="margin-top:10px"><button class="btn ghost" id="scanClose" style="flex:1">Back</button></div>`);
  const msg = t => { const el = $('scanMsg'); if (el) el.textContent = t; };
  sheetCleanup = () => { clearInterval(timer); if (stream) stream.getTracks().forEach(t => t.stop()); };
  const lookup = async raw => {
    const code = String(raw).replace(/\D/g, '');
    if (code.length < 8) return msg('That barcode looks too short. Check the digits.');
    if (busy) return;
    const saved = S.foods['code:' + code];
    if (saved && !saved.deleted) { closeSheet(); return openPortion(saved, meal); } // your own (possibly corrected) numbers win, and no network needed
    busy = true; msg(`Looking up ${code}…`);
    try {
      const food = await lookupBarcode(code);
      if (!food) { busy = false; return msg('Not in Open Food Facts yet. Close this, type the food and its calories by hand, and it will be remembered.'); }
      closeSheet(); openPortion(food, meal);
    } catch (e) { busy = false; msg(e.message); }
  };
  $('codeGo').onclick = () => lookup($('codeIn').value);
  $('codeIn').onkeydown = e => { if (e.key === 'Enter') lookup($('codeIn').value); };
  $('scanClose').onclick = () => { closeSheet(); openAdd(meal); };
  (async () => {
    if (!('BarcodeDetector' in window) || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return msg("This browser can't scan barcodes. Type the digits instead.");
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
      const v = $('scanVideo');
      if (!v) { stream.getTracks().forEach(t => t.stop()); return; } // sheet was closed while asking for permission
      v.srcObject = stream; await v.play();
      msg('Point the camera at the barcode.');
      const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] });
      timer = setInterval(async () => {
        if (busy) return;
        try { const found = await det.detect(v); if (found.length) lookup(found[0].rawValue); } catch { /* frame not ready */ }
      }, 300);
    } catch (e) {
      msg(e.name === 'NotAllowedError' ? 'Camera access was blocked. Allow the camera for this site, or type the digits.' : 'Could not start the camera. Type the digits instead.');
    }
  })();
}

function openPortion(food, meal) {
  const per = Object.assign({ kcal: null, p: null, c: null, f: null }, food.per100);
  let chosenMeal = meal;
  const noServing = food.source === 'off' && !food.servingG;
  const note = food.source === 'off' ? 'From Open Food Facts, which is crowd-sourced. Check the numbers against the pack.' : food.source === 'staple' ? 'Typical values for this food.' : '';
  const nv = v => (v === null || v === undefined ? '' : v);
  openSheet(`
    <h2>Add food</h2>
    <label class="lbl2" style="margin-top:0">Food</label><input class="field" id="pName" value="${esc(food.name)}">
    ${food.brand ? `<div class="muted" style="font-size:13px;margin:4px 2px">${esc(food.brand)}</div>` : ''}
    ${noServing ? `<div class="errbox">No serving size on file for this product. Enter the grams you actually had.</div>` : ''}
    <label class="lbl2">How much did you have (grams)</label>
    <input class="field num" id="pGrams" inputmode="decimal" value="${defaultGrams(food)}">
    <div class="chips" id="pQuick" style="margin-top:8px">
      ${food.servingG ? `<button class="chip" data-g="${food.servingG}">${esc(food.servingLabel || 'Serving')} · ${food.servingG} g</button>` : ''}
      <button class="chip" data-g="100">100 g</button>
    </div>
    <div class="card" style="padding:12px;margin:4px 0 8px"><div id="pTotal" class="num" style="font-weight:650">&nbsp;</div><div id="pMacros" class="muted num" style="font-size:13px">&nbsp;</div></div>
    <label class="lbl2">Numbers per 100 g (fix them here if they look wrong)</label>
    <div class="grid4">
      <input class="field num" id="pk" inputmode="decimal" placeholder="kcal" value="${nv(per.kcal)}">
      <input class="field num" id="pp" inputmode="decimal" placeholder="protein" value="${nv(per.p)}">
      <input class="field num" id="pc" inputmode="decimal" placeholder="carbs" value="${nv(per.c)}">
      <input class="field num" id="pf" inputmode="decimal" placeholder="fat" value="${nv(per.f)}">
    </div>
    ${note ? `<p class="muted" style="font-size:12px">${esc(note)}</p>` : ''}
    <label class="lbl2">Meal</label>${mealChipsHtml('pMeals', chosenMeal)}
    <div class="row" style="margin-top:6px"><button class="btn eat" id="pAdd" style="flex:1">Add</button><button class="btn ghost" id="pCancel">Cancel</button></div>`);
  const read = () => ({
    name: $('pName').value.trim(), grams: numOrNull($('pGrams').value),
    per: { kcal: numOrNull($('pk').value), p: numOrNull($('pp').value), c: numOrNull($('pc').value), f: numOrNull($('pf').value) },
  });
  const upd = () => {
    const v = read(), ok = v.name && v.grams > 0 && v.per.kcal !== null && v.per.kcal >= 0;
    $('pAdd').disabled = !ok;
    if (!ok) { $('pTotal').innerHTML = '&nbsp;'; $('pMacros').innerHTML = '&nbsp;'; return; }
    const pt = portion(v.per, v.grams);
    $('pTotal').textContent = `${pt.kcal} kcal`;
    $('pMacros').textContent = [pt.p, pt.c, pt.f].every(x => x !== null) ? `Protein ${pt.p} g · Carbs ${pt.c} g · Fat ${pt.f} g` : 'No protein, carbs or fat data for this food';
  };
  ['pName', 'pGrams', 'pk', 'pp', 'pc', 'pf'].forEach(id => { $(id).oninput = upd; });
  $('pQuick').querySelectorAll('button').forEach(b => b.onclick = () => { $('pGrams').value = b.dataset.g; upd(); });
  bindChips('pMeals', m => { chosenMeal = m; });
  $('pCancel').onclick = closeSheet;
  $('pAdd').onclick = () => {
    const v = read();
    const r = logPortion(Object.assign({}, food, { name: v.name, per100: v.per }), v.grams, chosenMeal, viewDate);
    closeSheet(); render(); loggedToast(r, v.name);
  };
  upd();
}

function undoLog(id, merged) {
  const e = S.entries[id]; if (!e) return;
  if (merged && e.qty > 1) { e.qty -= 1; e.updatedAt = Date.now(); }
  else { e.deleted = 1; e.deletedAt = Date.now(); }
  save(); render();
}
function copyMeal(meal) {
  const src = liveEntries(addDays(viewDate, -1)).filter(e => e.meal === meal);
  if (!src.length) return;
  const ids = src.map(e => {
    const id = uid();
    S.entries[id] = Object.assign({}, e, { id, date: viewDate, createdAt: Date.now(), updatedAt: Date.now() });
    return id;
  });
  save(); render();
  toast(`Copied ${ids.length} item${ids.length > 1 ? 's' : ''} from yesterday`, 'Undo', () => {
    ids.forEach(i => { S.entries[i].deleted = 1; S.entries[i].deletedAt = Date.now(); });
    save(); render();
  });
}

function openEdit(id) {
  const e = S.entries[id]; if (!e) return;
  let qty = e.qty, meal = e.meal;
  const base = !!e.per100, v = x => (typeof x === 'number' ? x : '');
  openSheet(`
    <h2>Edit entry</h2>
    <label class="lbl2" style="margin-top:0">Food</label><input class="field" id="eName" value="${esc(e.name)}">
    ${base ? `
      <label class="lbl2">Grams for one</label><input class="field num" id="eGrams" inputmode="decimal" value="${e.grams || ''}">
      <label class="lbl2">Numbers per 100 g (fix them here if a scan was wrong)</label>
      <div class="grid4">
        <input class="field num" id="ek" inputmode="decimal" placeholder="kcal" value="${v(e.per100.kcal)}">
        <input class="field num" id="ep" inputmode="decimal" placeholder="protein" value="${v(e.per100.p)}">
        <input class="field num" id="ec" inputmode="decimal" placeholder="carbs" value="${v(e.per100.c)}">
        <input class="field num" id="ef" inputmode="decimal" placeholder="fat" value="${v(e.per100.f)}">
      </div>` : `
      <label class="lbl2">Calories for one</label><input class="field num" id="eKcal" inputmode="decimal" value="${e.unitKcal}">
      <label class="lbl2">Protein, carbs, fat for one (optional)</label>
      <div class="grid3">
        <input class="field num" id="ep" inputmode="decimal" placeholder="protein" value="${hasMacros(e) ? e.unitP : ''}">
        <input class="field num" id="ec" inputmode="decimal" placeholder="carbs" value="${hasMacros(e) ? e.unitC : ''}">
        <input class="field num" id="ef" inputmode="decimal" placeholder="fat" value="${hasMacros(e) ? e.unitF : ''}">
      </div>`}
    <label class="lbl2">How many</label>
    <div class="stepper"><button id="qMinus" aria-label="Fewer">−</button><b class="num" id="qVal" style="font-size:20px;min-width:28px;text-align:center">${qty}</b><button id="qPlus" aria-label="More">+</button>
      <span class="muted num" id="qTotal"></span></div>
    <label class="lbl2">Meal</label>${mealChipsHtml('eMeals', meal)}
    <div class="row" style="margin-top:6px"><button class="btn eat" id="eSave" style="flex:1">Save</button><button class="btn danger" id="eDel">Delete</button><button class="btn ghost" id="eClose">Cancel</button></div>`);
  const calc = () => {
    if (base) {
      const per = { kcal: numOrNull($('ek').value), p: numOrNull($('ep').value), c: numOrNull($('ec').value), f: numOrNull($('ef').value) };
      const g = numOrNull($('eGrams').value);
      if (per.kcal === null || !(g > 0)) return null;
      const pt = portion(per, g);
      return { unitKcal: pt.kcal, unitP: pt.p, unitC: pt.c, unitF: pt.f, grams: g, per100: per };
    }
    const k = numOrNull($('eKcal').value);
    if (k === null || k < 0) return null;
    const m = [$('ep').value, $('ec').value, $('ef').value].map(numOrNull), any = m.some(x => x !== null);
    return { unitKcal: Math.round(k), unitP: any ? (m[0] || 0) : null, unitC: any ? (m[1] || 0) : null, unitF: any ? (m[2] || 0) : null };
  };
  const total = () => { $('qVal').textContent = qty; const c = calc(); $('qTotal').textContent = c ? `= ${fmt(c.unitKcal * qty)} kcal` : ''; };
  total();
  ['ek', 'ep', 'ec', 'ef', 'eKcal', 'eGrams'].forEach(i => { if ($(i)) $(i).oninput = total; });
  $('qMinus').onclick = () => { qty = Math.max(1, qty - 1); total(); };
  $('qPlus').onclick = () => { qty += 1; total(); };
  bindChips('eMeals', m => { meal = m; });
  $('eSave').onclick = () => {
    const c = calc(), n = $('eName').value.trim();
    if (!n || !c) return toast('Enter a name and valid numbers.');
    Object.assign(e, c, { name: n, qty, meal, updatedAt: Date.now() });
    let note = 'Saved';
    if (base && e.foodKey && S.foods[e.foodKey] && !S.foods[e.foodKey].deleted) {
      Object.assign(S.foods[e.foodKey], { per100: c.per100, name: n, updatedAt: Date.now() });
      note = 'Saved. Your saved food uses these numbers too.';
    }
    save(); closeSheet(); render(); toast(note);
  };
  $('eDel').onclick = () => {
    e.deleted = 1; e.deletedAt = Date.now(); save(); closeSheet(); render();
    toast('Deleted', 'Undo', () => { delete e.deleted; delete e.deletedAt; save(); render(); });
  };
  $('eClose').onclick = closeSheet;
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, label, fn, label2, fn2) {
  clearTimeout(toastTimer);
  $('toast').innerHTML = `<div class="toast"><span>${esc(msg)}</span>${label ? `<button id="toastBtn">${esc(label)}</button>` : ''}${label2 ? `<button id="toastBtn2">${esc(label2)}</button>` : ''}</div>`;
  if (label) $('toastBtn').onclick = () => { fn(); $('toast').innerHTML = ''; };
  if (label2) $('toastBtn2').onclick = () => { fn2(); $('toast').innerHTML = ''; };
  toastTimer = setTimeout(() => { $('toast').innerHTML = ''; }, label ? 7000 : 2500);
}

/* ---------- backup / demo / refresh ---------- */
function exportData() {
  const blob = new Blob([JSON.stringify({ app: 'intake', version: 1, exportedAt: Date.now(), entries: S.entries, foods: S.foods, fit: S.fit }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `intake-backup-${ymd(new Date())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importData(ev) {
  const file = ev.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (d.app !== 'intake' || typeof d.entries !== 'object') throw new Error('not a backup from this app');
      let added = 0;
      for (const [id, e] of Object.entries(d.entries)) {
        const mine = S.entries[id];
        if (mine && mine.deleted) continue;               // local tombstones always win
        if (!mine || (e.updatedAt || 0) > (mine.updatedAt || 0)) { S.entries[id] = e; added++; }
      }
      for (const [key, f] of Object.entries(d.foods || {})) {
        const mine = S.foods[key];
        if (mine && mine.deleted) continue;               // local tombstones always win
        if (!mine || (f.updatedAt || 0) > (mine.updatedAt || 0)) S.foods[key] = f;
      }
      for (const [date, v] of Object.entries(d.fit || {})) S.fit[date] = Object.assign({}, v, S.fit[date] || {});
      save(); render(); toast(`Imported ${added} entries`);
    } catch (e) { toast('Import failed: ' + e.message); }
  };
  r.readAsText(file);
}
function loadDemo() {
  const foods = [['Oats, dry (40 g)', 156, 'Breakfast'], ['Banana (1 medium)', 105, 'Breakfast'], ['Chicken breast, cooked (1 breast)', 198, 'Lunch'],
    ['Rice, cooked (1 cup)', 195, 'Lunch'], ['Salmon, cooked (1 fillet)', 247, 'Dinner'], ['Pasta, cooked (1 portion)', 221, 'Dinner'], ['Dark chocolate (2 squares)', 109, 'Snacks']];
  const today = ymd(new Date());
  for (let i = 1; i <= 14; i++) {
    const d = addDays(today, -i), seed = (i * 37) % 11;
    foods.forEach(([name, kcal, meal], k) => {
      if ((k + i) % 5 === 0) return;
      const id = `demo-${d}-${k}`;
      S.entries[id] = { id, date: d, meal, name, unitKcal: kcal, qty: 1 + (k === 6 ? seed % 2 : 0), createdAt: i * 1000 + k, updatedAt: i * 1000 + k };
    });
    S.fit[d] = { steps: 6000 + seed * 650, caloriesOut: 2300 + seed * 75, sleepMinutes: 380 + seed * 9, sleepDeepMin: 60 + seed * 2, sleepRemMin: 85 + seed * 3, restingHr: 56 + (seed % 4),
      activeKcal: 520 + seed * 40, hrv: 38 + seed, spo2: 95.5 + (seed % 3) / 2, breathingRate: 14.2 + (seed % 4) / 10, skinTempDelta: ((seed % 5) - 2) / 5,
      ...(i % 3 === 0 ? { weightKg: 81.5 - i * 0.05 + (seed % 3) / 10, bodyFatPct: 18.6 - i * 0.02 } : {}) };
  }
  S.fit[today] = { steps: 4210, caloriesOut: 1480, sleepMinutes: 422, sleepDeepMin: 71, sleepRemMin: 96, restingHr: 57, activeKcal: 410, hrv: 41, spo2: 96, breathingRate: 14.5, skinTempDelta: 0.2 };
  save();
}
function removeDemo() {
  Object.keys(S.entries).filter(k => k.startsWith('demo-')).forEach(k => delete S.entries[k]);
  S.fit = {}; save();
}
async function forceRefresh() {
  try {
    if (navigator.serviceWorker) (await navigator.serviceWorker.getRegistrations()).forEach(r => r.unregister());
    if (window.caches) (await caches.keys()).forEach(k => caches.delete(k));
  } catch { /* ignore */ }
  location.href = location.pathname + '?v=' + Date.now();
}

/* ---------- boot ---------- */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => { /* app works without it */ });
}
render();
if (S.settings.appKey) sync();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.settings.appKey && (!S.sync || Date.now() - S.sync.at > 10 * 60 * 1000)) sync();
});
